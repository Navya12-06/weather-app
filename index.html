<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
<div class = "card">
    <div class = "search">
        <input type="text" placeholder="enter city name" spellcheck="false">
        <button><img src="https://www.shutterstock.com/image-vector/magnify-icon-vector-eps10-260nw-1220721013.jpg" class="search-icon"></button>
    </div>
    <div class ="weather">
        <img src="https://cdn-icons-png.flaticon.com/512/4235/4235322.png" class="weather-icon">
        <h1 class="temp">24°C</h1>
        <h2 class ="city">Meerut</h2>
        <div class="details">
            <div class="col">
                <img src="https://cdn-icons-png.flaticon.com/512/5664/5664982.png">
                <div>
                    <p class ="humidity">50%</p>
                    <p>Humidity</p>
                </div>
            
            
            </div><div class="col">
                <img src="https://png.pngtree.com/png-vector/20190411/ourmid/pngtree-vector-wind-icon-png-image_924484.jpg">
                <div>
                    <p class ="wind">15 km/h</p>
                    <p>wind speed</p>
                </div>    
            </div>
        </div>
    </div>
</div>
</div>
</div>
  
<script>
const apiKey ="47ab956ad1ee3995c39ce5b8a296c098";
const apiurl ="https://api.openweathermap.org/data/2.5/weather";
const searchBox = document.querySelector(".search input");
const searchBtn = document.querySelector(".search button");
async function checkWeather(city){
    const response = await fetch(`${apiurl}?q=${city}&appid=${apiKey}&units=metric`);
     
    var data = await response.json();
    console.log(data);
    
    document.querySelector(".city").innerHTML = data.name;
    
    document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°c";
    document.querySelector(".humidity").innerHTML = data.main.humidity + " %";
    document.querySelector(".wind").innerHTML = data.wind.speed +" km/h";


}
searchBtn.addEventListener("click", ()=>{
    checkWeather(searchBox.value);
})

    
</script>
     
</body>
</html>
